name: Autoscaled Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Per-target Go fuzz duration ([0-9]+[smh], total waves under 240m)
        required: false
        default: 10m
      parallel:
        description: Concurrent fuzz targets
        required: false
        default: "1"
      fuzz_race:
        description: Run fuzzing with the race detector (1 or 0)
        required: false
        default: "0"
      gomaxprocs:
        description: Go scheduler CPU cap per fuzz target
        required: false
        default: "1"
      fuzz_test_parallel:
        description: Go fuzz worker cap per target
        required: false
        default: "1"
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: autoscaled-fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  # Keep these fallbacks in sync with the workflow_dispatch defaults above;
  # scheduled events do not provide inputs.
  FUZZTIME: ${{ inputs.fuzztime || '10m' }}
  PARALLEL: ${{ inputs.parallel || '1' }}
  # Keep scheduled runs host-friendly; use workflow_dispatch to opt into race fuzzing.
  FUZZ_RACE: ${{ inputs.fuzz_race || '0' }}
  GOMAXPROCS: ${{ inputs.gomaxprocs || '1' }}
  FUZZ_TEST_PARALLEL: ${{ inputs.fuzz_test_parallel || '1' }}
  FUZZ_MAX_WALL_MINUTES: "240"

jobs:
  validate_inputs:
    name: Validate fuzz inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        run: scripts/validate-fuzz-inputs.sh

  fuzz:
    name: Autoscaled fuzz (${{ matrix.arch }})
    needs: validate_inputs
    if: (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && needs.validate_inputs.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner_label: cpace-garm-linux-fuzz-arm64
          - arch: amd64
            runner_label: cpace-garm-linux-fuzz-amd64
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.runner_label }}
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner dependencies
        shell: sh
        run: |
          set -eu
          missing=""
          for tool in bash find jq mktemp sed sort touch xargs; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing="${missing} ${tool}"
            fi
          done
          c_compiler="${CC:-}"
          if [ -n "$c_compiler" ]; then
            if ! command -v "$c_compiler" >/dev/null 2>&1; then
              missing="${missing} C compiler (${c_compiler})"
            fi
          elif command -v cc >/dev/null 2>&1; then
            c_compiler=cc
          elif command -v gcc >/dev/null 2>&1; then
            c_compiler=gcc
          elif command -v clang >/dev/null 2>&1; then
            c_compiler=clang
          else
            missing="${missing} C compiler (cc, gcc, or clang)"
          fi
          if [ -n "$missing" ]; then
            echo "missing required runner tools:${missing}" >&2
            exit 1
          fi
          echo "CC=${c_compiler}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$(go env GOPATH)/bin" scripts/go-tool.sh install task

      - name: Report fuzz plan
        shell: bash
        run: |
          set -euo pipefail
          echo "FUZZTIME=${FUZZTIME}"
          echo "PARALLEL=${PARALLEL}"
          echo "FUZZ_RACE=${FUZZ_RACE}"
          echo "GOMAXPROCS=${GOMAXPROCS}"
          echo "FUZZ_TEST_PARALLEL=${FUZZ_TEST_PARALLEL}"
          echo "ARCH=${{ matrix.arch }}"
          jq -r '.[] | "\(.target) \(.package)"' .github/fuzz-targets.json

      - name: Snapshot corpus state
        shell: bash
        run: touch "${RUNNER_TEMP}/fuzz-start"

      - name: Run autoscaled fuzz
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          FUZZ_RACE="${FUZZ_RACE}" PARALLEL="${PARALLEL}" GOMAXPROCS="${GOMAXPROCS}" FUZZ_TEST_PARALLEL="${FUZZ_TEST_PARALLEL}" \
            "$(go env GOPATH)/bin/task" fuzz FUZZTIME="${FUZZTIME}"

      - name: Find newly captured corpus files
        id: corpus
        if: steps.fuzz.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -path "*/testdata/fuzz/*/*" -newer "${RUNNER_TEMP}/fuzz-start" | sort | sed 's#^\./##')"
          if [ -n "$files" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo 'files<<EOF'
              echo "$files"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload newly captured corpus files
        if: steps.fuzz.outcome == 'failure' && steps.corpus.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autoscaled-fuzz-${{ matrix.arch }}-corpus
          path: ${{ steps.corpus.outputs.files }}
          retention-days: 14

      - name: Fail job if fuzz step failed
        if: steps.fuzz.outcome == 'failure'
        run: exit 1
