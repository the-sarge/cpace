name: SAST Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: sast-gate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast-gate:
    name: SAST Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Report Go environment
        run: |
          go version
          go env GOTOOLCHAIN GOPROXY GOSUMDB

      - name: Install task
        run: scripts/go-tool.sh install task

      - name: Install golangci-lint
        run: scripts/go-tool.sh install golangci-lint

      - name: Run golangci-lint
        id: sast
        continue-on-error: true
        run: task lint:golangci GOLANGCI_LINT=golangci-lint GOLANGCI_ARGS='--output.text.path stdout --output.sarif.path golangci.sarif'

      - name: Upload golangci-lint SARIF to code scanning
        if: always() && hashFiles('golangci.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: golangci.sarif
          category: sast-gate

      - name: Report golangci-lint result
        if: steps.sast.outcome == 'failure'
        run: exit 1

      - name: Install ast-grep
        env:
          AST_GREP_VERSION: 0.43.0
          AST_GREP_SHA256: a26253a9c821d935f7e383e40f0de7c2ca62a4121de1f73a6d81ec32eae631e0
        run: |
          set -euo pipefail
          asset="app-x86_64-unknown-linux-gnu.zip"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/${asset}"
          echo "${AST_GREP_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          unzip -j -o "${RUNNER_TEMP}/${asset}" ast-grep -d "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/ast-grep"
          sudo mv "${RUNNER_TEMP}/ast-grep" /usr/local/bin/ast-grep
          ast-grep --version

      - name: Run ast-grep structural rules
        run: ast-grep scan --error
