name: Vulnerability Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: vuln-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Report Go environment
        run: |
          go version
          go env GOTOOLCHAIN GOPROXY GOSUMDB

      - name: Install task
        run: scripts/go-tool.sh install task

      - name: Install govulncheck
        run: scripts/go-tool.sh install govulncheck

      - name: Run vulnerability scan
        run: task vuln
